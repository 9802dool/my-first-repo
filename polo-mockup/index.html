<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Polo jersey mockup</title>
    <style>
      :root {
        --bg: #0f1419;
        --panel: #1a2332;
        --text: #e8eef5;
        --muted: #8b9cb3;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(ellipse 120% 80% at 50% -20%, #243044 0%, var(--bg) 55%);
        color: var(--text);
        padding: 2rem 1rem;
      }

      .wrap {
        text-align: center;
        max-width: 520px;
      }

      h1 {
        font-weight: 600;
        font-size: 1.25rem;
        letter-spacing: -0.02em;
        margin: 0 0 0.35rem;
      }

      p {
        margin: 0 0 1.5rem;
        font-size: 0.875rem;
        color: var(--muted);
      }

      .mock {
        background: var(--panel);
        border-radius: 16px;
        padding: 2rem 2rem 1.75rem;
        box-shadow:
          0 24px 48px rgba(0, 0, 0, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }

      .mock svg {
        display: block;
        width: min(100%, 360px);
        height: auto;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Polo jersey mockup</h1>
      <p>Vector front view — collar, placket, and sleeves. Open this file in a browser.</p>
      <div class="mock" aria-label="Polo shirt illustration">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 400 460"
          role="img"
        >
          <title>Polo shirt front mockup</title>
          <defs>
            <linearGradient id="fabric" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#2d6a8f" />
              <stop offset="45%" stop-color="#1e4d6b" />
              <stop offset="100%" stop-color="#153a52" />
            </linearGradient>
            <linearGradient id="fabricLight" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#3a7fa8" />
              <stop offset="100%" stop-color="#1e4d6b" />
            </linearGradient>
            <linearGradient id="collarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#4a90b8" />
              <stop offset="100%" stop-color="#245a7a" />
            </linearGradient>
            <linearGradient id="placketGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#1a3d55" />
              <stop offset="50%" stop-color="#2d5f7a" />
              <stop offset="100%" stop-color="#1a3d55" />
            </linearGradient>
            <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25" />
            </filter>
          </defs>

          <!-- Ground shadow -->
          <ellipse cx="200" cy="428" rx="120" ry="14" fill="#000" opacity="0.2" />

          <!-- Left sleeve -->
          <path
            fill="url(#fabric)"
            stroke="#0f2a3a"
            stroke-width="1.2"
            d="M 78 168 Q 52 188 42 230 L 38 268 Q 36 288 52 292 L 88 298 Q 104 300 108 282 L 118 228 Q 122 198 108 178 Z"
          />
          <path fill="#000" opacity="0.12" d="M 48 240 L 100 252 L 96 278 L 44 266 Z" />

          <!-- Right sleeve -->
          <path
            fill="url(#fabric)"
            stroke="#0f2a3a"
            stroke-width="1.2"
            d="M 322 168 Q 348 188 358 230 L 362 268 Q 364 288 348 292 L 312 298 Q 296 300 292 282 L 282 228 Q 278 198 292 178 Z"
          />
          <path fill="#000" opacity="0.12" d="M 352 240 L 300 252 L 304 278 L 356 266 Z" />

          <!-- Torso -->
          <path
            filter="url(#softShadow)"
            fill="url(#fabric)"
            stroke="#0f2a3a"
            stroke-width="1.2"
            d="M 118 168
               C 118 130 130 95 200 88
               C 270 95 282 130 282 168
               L 288 380
               Q 290 400 270 405 L 130 405
               Q 110 400 112 380 Z"
          />

          <!-- Side shading -->
          <path
            fill="#000"
            opacity="0.08"
            d="M 118 168 L 125 400 L 145 402 L 138 175 Z"
          />
          <path
            fill="#fff"
            opacity="0.06"
            d="M 282 168 L 275 400 L 255 402 L 262 175 Z"
          />

          <!-- Chest highlight -->
          <ellipse cx="200" cy="220" rx="55" ry="70" fill="#fff" opacity="0.04" />

          <!-- Collar back / neck inner -->
          <path
            fill="#143344"
            d="M 165 108 L 200 118 L 235 108 Q 200 98 165 108 Z"
          />

          <!-- Collar left wing -->
          <path
            fill="url(#collarGrad)"
            stroke="#0f2a3a"
            stroke-width="1"
            d="M 200 118 L 130 125 Q 118 128 115 138 L 112 152 Q 125 158 138 155 L 195 138 Z"
          />

          <!-- Collar right wing -->
          <path
            fill="url(#collarGrad)"
            stroke="#0f2a3a"
            stroke-width="1"
            d="M 200 118 L 270 125 Q 282 128 285 138 L 288 152 Q 275 158 262 155 L 205 138 Z"
          />

          <!-- Placket -->
          <rect
            x="184"
            y="118"
            width="32"
            height="118"
            rx="3"
            fill="url(#placketGrad)"
            stroke="#0f2a3a"
            stroke-width="1"
          />
          <line x1="200" y1="128" x2="200" y2="228" stroke="#0a2533" stroke-width="1" opacity="0.5" />

          <!-- Buttons -->
          <circle cx="200" cy="142" r="5" fill="#d4e8f5" stroke="#2a5a75" stroke-width="0.8" />
          <circle cx="200" cy="168" r="5" fill="#d4e8f5" stroke="#2a5a75" stroke-width="0.8" />
          <circle cx="200" cy="194" r="5" fill="#d4e8f5" stroke="#2a5a75" stroke-width="0.8" />

          <!-- Sleeve cuffs -->
          <path
            fill="#245a7a"
            stroke="#0f2a3a"
            stroke-width="0.8"
            d="M 38 268 L 42 230 L 118 228 L 108 282 Z"
          />
          <path
            fill="#245a7a"
            stroke="#0f2a3a"
            stroke-width="0.8"
            d="M 362 268 L 358 230 L 282 228 L 292 282 Z"
          />

          <!-- Hem -->
          <path
            fill="none"
            stroke="#0f2a3a"
            stroke-width="1.5"
            opacity="0.4"
            d="M 125 398 Q 200 408 275 398"
          />
        </svg>
      </div>
    </div>
  </body>
</html>
